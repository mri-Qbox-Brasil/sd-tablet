name: Auto release

# MRI: publishes v<version>-mri.1 when main carries a fxmanifest version that has no MRI release yet.
on:
  push:
    branches: [main]
    paths: [fxmanifest.lua]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oE "^version '[^']+'" fxmanifest.lua | cut -d"'" -f2)
          [ -n "$version" ] || { echo "::error::no version in fxmanifest.lua"; exit 1; }
          if git tag -l "v${version}-mri.*" | grep -q .; then
            echo "v${version} already has an MRI release"; exit 0
          fi
          tag="v${version}-mri.1"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          # A release made with GITHUB_TOKEN doesn't fire `release: published`, so package it directly.
          gh workflow run release.yml -f tag="$tag"
